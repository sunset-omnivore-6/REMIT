name: NG stock probe
on:
  workflow_dispatch:
  push:
    branches: [ng-stock-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 3-month deviation incident count
        run: |
          BASE='https://data.nationalgas.com/api/find-gas-data-download?applicableFor=Y&dateType=GASDAY&latestFlag=Y&type=CSV'
          FROM=2026-03-26; TO=2026-06-26
          curl -sS -o stock.csv "${BASE}&dateFrom=${FROM}&dateTo=${TO}&ids=PUBOBJ2362,PUBOBJ2367"
          curl -sS -o noms.csv  "${BASE}&dateFrom=${FROM}&dateTo=${TO}&ids=PUBOBJ1127,PUBOBJ1095,PUBOBJ1133,PUBOBJ1098"
          python3 - <<'PY'
          import csv, datetime
          def load(fn): return list(csv.DictReader(open(fn)))
          def gd(s): return datetime.datetime.strptime(s.strip(),"%d/%m/%Y").date()
          def site_of(it):
              it=it.lower(); return 'Aldbrough' if 'aldbrough' in it else ('Hornsea' if 'hornsea' in it else None)
          stock={}
          for r in load('stock.csv'):
              s=site_of(r['Data Item'])
              if s and 'opening stock' in r['Data Item'].lower(): stock[(s,gd(r['Applicable For']))]=float(r['Value'])
          en={}; ex={}
          for r in load('noms.csv'):
              s=site_of(r['Data Item']); il=r['Data Item'].lower()
              if not s: continue
              d=gd(r['Applicable For']); v=float(r['Value'])
              if 'storage entry' in il: en[(s,d)]=v
              elif 'storage exit' in il: ex[(s,d)]=v
          for site in ('Aldbrough','Hornsea'):
              days=sorted(d for (s,d) in stock if s==site)
              n=0; inc=[]
              for d in days:
                  nxt=d+datetime.timedelta(days=1)
                  if (site,nxt) not in stock: continue
                  n+=1
                  net=ex.get((site,d),0)-en.get((site,d),0)
                  pred=stock[(site,d)]+net; act=stock[(site,nxt)]
                  diff=(act-pred)/1e6
                  if abs(diff)>5: inc.append((nxt,diff))   # nxt = the confirmed opening that deviates
              print(f"\n{site}: {n} transitions, {len(inc)} deviations >5 GWh")
              for d,df in inc: print(f"    confirmed opening {d}  deviates {df:+.1f} GWh from nomination calc")
          PY
