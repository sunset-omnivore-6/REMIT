name: NG stock probe
on:
  workflow_dispatch:
  push:
    branches: [ng-stock-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Which transport passes Cloudflare for National Gas?
        run: |
          pip install --quiet "curl_cffi>=0.7" "requests>=2.31"
          URL='https://data.nationalgas.com/api/find-gas-data-download?applicableFor=Y&dateType=GASDAY&latestFlag=Y&type=CSV&dateFrom=2026-06-24&dateTo=2026-06-26&ids=PUBOBJ2362,PUBOBJ2367'
          python3 - "$URL" <<'PY'
          import sys
          url=sys.argv[1]
          # 1) curl_cffi impersonate chrome131
          try:
              from curl_cffi import requests as cr
              r=cr.get(url, impersonate="chrome131", timeout=30)
              print("curl_cffi chrome131:", r.status_code, "bytes", len(r.text))
          except Exception as e: print("curl_cffi EXC", e)
          # 2) plain requests, browser UA
          try:
              import requests
              ua="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/148.0.0.0 Safari/537.36"
              r=requests.get(url, headers={"User-Agent":ua,"Accept":"text/csv,*/*"}, timeout=30)
              print("requests+UA:", r.status_code, "bytes", len(r.text))
          except Exception as e: print("requests EXC", e)
          # 3) plain requests, no UA (current fallback)
          try:
              import requests
              r=requests.get(url, headers={"Accept":"text/csv,*/*"}, timeout=30)
              print("requests no-UA:", r.status_code, "bytes", len(r.text))
          except Exception as e: print("requests-noUA EXC", e)
          PY
