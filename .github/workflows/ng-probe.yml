name: NG stock probe
on:
  workflow_dispatch:
  push:
    branches: [ng-stock-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch 30d stock + nominations, analyse prediction error
        run: |
          BASE='https://data.nationalgas.com/api/find-gas-data-download?applicableFor=Y&dateType=GASDAY&latestFlag=Y&type=CSV'
          FROM=2026-05-27; TO=2026-06-26
          curl -sS -o stock.csv "${BASE}&dateFrom=${FROM}&dateTo=${TO}&ids=PUBOBJ2362,PUBOBJ2367"
          curl -sS -o noms.csv  "${BASE}&dateFrom=${FROM}&dateTo=${TO}&ids=PUBOBJ1127,PUBOBJ1095,PUBOBJ1133,PUBOBJ1098"
          python3 - <<'PY'
          import csv, datetime
          def load(fn):
              with open(fn) as f: return list(csv.DictReader(f))
          def gd(s): return datetime.datetime.strptime(s.strip(), "%d/%m/%Y").date()
          def site_of(it):
              it=it.lower()
              return 'Aldbrough' if 'aldbrough' in it else ('Hornsea' if 'hornsea' in it else None)
          stock={}
          for r in load('stock.csv'):
              s=site_of(r['Data Item'])
              if s and 'opening stock' in r['Data Item'].lower():
                  stock[(s,gd(r['Applicable For']))]=float(r['Value'])
          entry={}; exit_={}   # Entry = withdrawal (stock down); Exit = injection (stock up)
          for r in load('noms.csv'):
              s=site_of(r['Data Item']); il=r['Data Item'].lower()
              if not s: continue
              d=gd(r['Applicable For']); v=float(r['Value'])
              if 'storage entry' in il: entry[(s,d)]=v
              elif 'storage exit' in il: exit_[(s,d)]=v
          for site in ('Aldbrough','Hornsea'):
              print(f"\n================ {site} ================")
              print(f"{'gasday':11}{'open':>8}{'wd(En)':>8}{'inj(Ex)':>8}{'net':>8}{'pred':>8}{'actual':>8}{'diff':>8}  flags")
              days=sorted(d for (s,d) in stock if s==site)
              bad=[]; bidir=[]
              for d in days:
                  nxt=d+datetime.timedelta(days=1)
                  if (site,nxt) not in stock: continue
                  e=entry.get((site,d),0.0); x=exit_.get((site,d),0.0)
                  net=(x-e)/1e6
                  op=stock[(site,d)]/1e6; act=stock[(site,nxt)]/1e6
                  pred=op+net; diff=act-pred
                  both = e>1e6 and x>1e6     # both directions materially nominated
                  flag = ('BIDIR ' if both else '') + ('**BIG' if abs(diff)>5 else '')
                  if both: bidir.append((d,diff))
                  if abs(diff)>5: bad.append((d,diff,both))
                  print(f"{str(d):11}{op:>8.1f}{e/1e6:>8.1f}{x/1e6:>8.1f}{net:>8.1f}{pred:>8.1f}{act:>8.1f}{diff:>+8.1f}  {flag}")
              print(f"\n  {site}: days with |diff|>5 GWh -> {len(bad)}")
              for d,df,both in bad: print(f"     {d}  diff={df:+.1f}  bidirectional={both}")
              print(f"  {site}: bidirectional days (both En & Ex >1GWh) -> {len(bidir)}")
              for d,df in bidir: print(f"     {d}  diff={df:+.1f}  {'<-- BIG' if abs(df)>5 else 'ok'}")
          PY
