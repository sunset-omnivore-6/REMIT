name: NG stock probe
on:
  workflow_dispatch:
  push:
    branches: [ng-stock-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: End-to-end stock_status with live data
        run: |
          python3 - <<'PY'
          import urllib.request, csv, io
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo
          BASE="https://data.nationalgas.com/api/find-gas-data-download"
          SMAP={"aldbrough":"Aldbrough","hornsea":"Atwick"}
          TECH={("Aldbrough","Storage"):3.3,("Atwick","Storage"):3.47}; THR=10.0
          def get(url):
              return urllib.request.urlopen(url, timeout=30).read().decode()
          def gday(s): return datetime.strptime(s.strip(),"%d/%m/%Y").date()
          def sof(it):
              il=it.lower()
              for k,v in SMAP.items():
                  if k in il: return v
          today=datetime.now(ZoneInfo("Europe/London")).date()
          frm=(today-timedelta(days=6)).strftime("%Y-%m-%d"); to=today.strftime("%Y-%m-%d")
          common=f"applicableFor=Y&dateType=GASDAY&latestFlag=Y&type=CSV&dateFrom={frm}&dateTo={to}"
          stock_csv=get(f"{BASE}?{common}&ids=PUBOBJ2362,PUBOBJ2367")
          nom_csv=get(f"{BASE}?{common}&ids=PUBOBJ1127,PUBOBJ1095,PUBOBJ1133,PUBOBJ1098")
          stock={}
          for r in csv.DictReader(io.StringIO(stock_csv)):
              s=sof(r.get("Data Item",""))
              if s and "opening stock" in r["Data Item"].lower():
                  try: stock[(s,gday(r["Applicable For"]))]=float(r["Value"])
                  except: pass
          en={}; ex={}
          for r in csv.DictReader(io.StringIO(nom_csv)):
              s=sof(r.get("Data Item","")); il=r.get("Data Item","").lower()
              if not s: continue
              try: d=gday(r["Applicable For"]); v=float(r["Value"])
              except: continue
              if "storage entry" in il: en[(s,d)]=v
              elif "storage exit" in il: ex[(s,d)]=v
          now=datetime.now(ZoneInfo("Europe/London"))
          today_gd=now.date()-(timedelta(days=1) if now.hour<5 else timedelta())
          print("London now:",now.strftime("%Y-%m-%d %H:%M %Z"),"| today gas day:",today_gd)
          def net(s,d): return (ex.get((s,d),0)-en.get((s,d),0)) if ((s,d) in en or (s,d) in ex) else None
          for s in ("Aldbrough","Atwick"):
              days=sorted(d for (a,d) in stock if a==s); latest=days[-1]; tech=TECH[(s,"Storage")]
              dev=None; fl=False
              if latest>=today_gd:
                  v=stock[(s,latest)]; mode="confirmed"; gd=latest; prev=latest-timedelta(days=1); n=net(s,prev)
                  if (s,prev) in stock and n is not None: dev=(v-(stock[(s,prev)]+n))/1e6; fl=abs(dev)>THR
              else:
                  n=net(s,latest)
                  if n is None: v=stock[(s,latest)]; mode="confirmed"; gd=latest
                  else: v=stock[(s,latest)]+n; mode="estimated"; gd=latest+timedelta(days=1)
              twh=v/1e9; pct=twh/tech*100
              print(f"  {s:9} -> {twh:.4f} TWh ({pct:.1f}%)  mode={mode}  gas_day={gd}  deviation={dev}  flagged={fl}")
          PY
