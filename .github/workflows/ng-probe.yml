name: NG stock probe
on:
  workflow_dispatch:
  push:
    branches: [ng-stock-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Aldbrough nominations + stock, 14-17 Jun (raw)
        run: |
          BASE='https://data.nationalgas.com/api/find-gas-data-download?applicableFor=Y&dateType=GASDAY&latestFlag=Y&type=CSV'
          curl -sS -o noms.csv  "${BASE}&dateFrom=2026-06-14&dateTo=2026-06-17&ids=PUBOBJ1127,PUBOBJ1095,PUBOBJ1133,PUBOBJ1098"
          curl -sS -o stock.csv "${BASE}&dateFrom=2026-06-14&dateTo=2026-06-17&ids=PUBOBJ2362,PUBOBJ2367"
          echo '===== ALDBROUGH NOMINATIONS (raw rows) ====='
          head -1 noms.csv
          grep -i aldbrough noms.csv | sort
          echo
          echo '===== ALDBROUGH STOCK (raw rows) ====='
          head -1 stock.csv
          grep -i aldbrough stock.csv | sort
          echo
          echo '===== Aldbrough summary (GWh) ====='
          python3 - <<'PY'
          import csv, datetime
          def gd(s): return datetime.datetime.strptime(s.strip(), "%d/%m/%Y").date()
          noms={}
          for r in csv.DictReader(open('noms.csv')):
              di=r['Data Item']
              if 'aldbrough' not in di.lower(): continue
              d=gd(r['Applicable For']); side='Entry(wd)' if 'entry' in di.lower() else 'Exit(inj)'
              noms[(d,side)]=float(r['Value'])
          stock={}
          for r in csv.DictReader(open('stock.csv')):
              if 'aldbrough' in r['Data Item'].lower():
                  stock[gd(r['Applicable For'])]=float(r['Value'])
          for d in sorted(set(k[0] for k in noms)):
              e=noms.get((d,'Entry(wd)'),0); x=noms.get((d,'Exit(inj)'),0)
              op=stock.get(d); nxt=stock.get(d+datetime.timedelta(days=1))
              act=(nxt-op)/1e6 if (op is not None and nxt is not None) else None
              print(f"{d}: Entry(wd)={e/1e6:8.3f} GWh  Exit(inj)={x/1e6:8.3f} GWh  net(Exit-Entry)={(x-e)/1e6:+8.3f}  "
                    f"open={op/1e6 if op is not None else '-':>7}  actual_change={f'{act:+.3f}' if act is not None else '-'}")
          PY
