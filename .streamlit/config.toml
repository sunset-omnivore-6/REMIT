[theme]
base = "light"
primaryColor = "#1c2430"          # ink: buttons never wear a data colour (blue means Planned REMIT only)
backgroundColor = "#f5f5f2"
secondaryBackgroundColor = "#ffffff"
textColor = "#1c2430"
font = "sans serif"

[client]
toolbarMode = "minimal"           # no Deploy button / developer menu on the wall screen

[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false
